{%extends 'base.html'%}
{%block content%}

    <h1>My Todo List</h1>
    <table>
        <tr>
            <th id="title" scope="col">Title</th>
            <th id="description" scope="col">Description</th>
            <th id="date_added" scope="col">Date Added</th>
            <th id="date_ending" scope="col">Due Date</th>
            <th id="actions" scope="col">Actions</th>
        </tr>
        
        {% for todo in todos %}
            <tr>
                <td>{{ todo.title }}</td>
                <td>{{ todo.description }}</td>
                <td>{{ todo.date_added }}</td></td>
                <td>{{ todo.date_ending }}</td>
                <td>
                    <a href="{{ url_for('delete', todo_id=(todo.id))}}"><button>Delete</button></a>
                    <a href="{{ url_for('update', todo_id=(todo.id))}}"><button>Edit</button></a>
                </td>
            </tr>
        {% endfor %}
    </table>
    <style>
        h1 {
            text-align: center;
        }
        #actions {
            width: 10%;
        }
        #title {
            width: 10%;
        }
        #description {
            width: 40%;
        }
        #date_added {
            width: 20%;
        }
        #date_ending {
            width: 20%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #ddd;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
{%endblock%}
